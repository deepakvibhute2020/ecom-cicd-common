name: Centralized Email Notification

on:
  repository_dispatch:
    types: [send-notification-on-build-failure]

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Send Build Failure Email
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "BUILD FAILED - ${{ github.event.client_payload.repository }}"

          to: ${{ vars.BUILD_NOTIFICATION_EMAILS }}

          from: ECON GitHub Actions

          body: |
            ECON Build Failure Notification

            Repository: ${{ github.event.client_payload.repository }}
            Branch: ${{ github.event.client_payload.branch }}
            Workflow: ${{ github.event.client_payload.workflow }}

            Build Logs:
            ${{ github.event.client_payload.run_url }}
