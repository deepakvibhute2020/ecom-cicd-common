name: Email Notification

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      branch:
        required: true
        type: string
      run_url:
        required: true
        type: string
    secrets:
      SMTP_USERNAME:
        required: true
      SMTP_PASSWORD:
        required: true
      BUILD_NOTIFICATION_EMAILS:
        required: true

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Send Build Failure Email
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "BUILD FAILED - ${{ inputs.repository }}"
          to: ${{ secrets.BUILD_NOTIFICATION_EMAILS }}
          from: GitHub Actions
          body: |
            Build Failure Notification

            Repository: ${{ inputs.repository }}
            Branch: ${{ inputs.branch }}

            Build Logs:
            ${{ inputs.run_url }}